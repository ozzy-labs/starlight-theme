name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    env:
      # trivy is a local-only security scanner (lefthook pre-commit / dev use).
      # CI build/test does not need it, and resolving aqua:aquasecurity/trivy
      # releases via GitHub API has been hitting 403 (secondary rate limit /
      # auth scope) even with GITHUB_TOKEN set. Skip install in CI entirely.
      # See handbook#84 / commons#73.
      MISE_DISABLE_TOOLS: trivy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
