name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # trivy is a local-only security scanner (lefthook pre-commit / dev use).
          # CI build/test does not need it, and resolving aqua:aquasecurity/trivy
          # releases via GitHub API has been hitting 403 (secondary rate limit /
          # auth scope) even with GITHUB_TOKEN set. Skip install in CI entirely.
          # See handbook#84 / commons#73.
          MISE_DISABLE_TOOLS: trivy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  pr-title-check:
    name: PR Title Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\(.+\))?!?:\s.+/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title does not follow Conventional Commits format.\n\n` +
                `Expected format: type(scope): description\n` +
                `Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore\n\n` +
                `Current title: ${title}`
              );
            } else {
              core.info('PR title follows Conventional Commits format');
            }

  branch-name-check:
    name: Branch Name Check
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)\/.+/;

            if (branch === 'main' || branch.startsWith('release-please--')) {
              core.info('Branch is main or release-please, skipping check');
              return;
            }

            if (!pattern.test(branch)) {
              core.setFailed(
                `Branch name does not follow naming convention.\n\n` +
                `Expected format: type/description\n` +
                `Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore\n\n` +
                `Current branch: ${branch}`
              );
            } else {
              core.info('Branch name follows naming convention');
            }
