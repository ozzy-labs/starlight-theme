[tools]
# Runtime & package managers
node = "24"
# aqua backend fails: registry expects v11 .tar.gz format (see ozzy-labs/commons#100).
# Pinned to 10.33.0: pnpm dropped npm provenance attestations from 10.34.0 onward,
# so mise's no-downgrade trust policy refuses to install the 10.34.x releases that
# a bare "10" resolves to. Matches package.json's packageManager field.
"npm:pnpm" = "10.33.0"
uv = "0.11.10"

# Linters & formatters
biome = "2"
shellcheck = "0.11"
shfmt = "3"
taplo = "0.10"
"npm:markdownlint-cli2" = "0.21"
"pipx:yamllint" = "1"
yamlfmt = "0.21"
actionlint = "1"
gitleaks = "8"
trivy = "0.69"
"pipx:mdformat" = "0.7"

# Testing
"npm:bats" = "1"

# CLI utilities for AI-assisted development
ast-grep = "0.42"
yq = "4"
just = "1"
zoxide = "0.9"

# Git hooks & commit conventions
lefthook = "2"
"npm:@commitlint/cli" = "20"
"npm:@commitlint/config-conventional" = "20"
